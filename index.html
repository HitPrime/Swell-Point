<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Swell Point Indicator | Structured Trading Education by Cassius Cuvee</title>
    <meta name="description" content="The Swell Point Indicator is a structured educational tool designed to help traders develop a clear, repeatable approach to market analysis. Instant access upon purchase." />
    <meta name="author" content="Cassius Cuvee" />

    <!-- Open Graph (Facebook / Meta Ads) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Swell Point" />
    <meta property="og:title" content="Swell Point Indicator | Structured Trading Education" />
    <meta property="og:description" content="A structured educational tool built to help traders develop a clear, repeatable approach to reading market conditions. Instant access." />
    <!-- No og:url on purpose: the same build serves getswellpoint.com and buyswellpoint.com, so each shared link keeps its own domain -->
    <!-- Share image lives in public/ so its URL never changes; Facebook needs an absolute https URL -->
    <meta property="og:image" content="https://www.getswellpoint.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://www.getswellpoint.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Swell Point Indicator on a TradingView chart" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Swell Point Indicator | Structured Trading Education" />
    <meta name="twitter:description" content="A structured educational tool built to help traders develop a clear, repeatable approach to reading market conditions." />
    <meta name="twitter:image" content="https://www.getswellpoint.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Swell Point Indicator on a TradingView chart" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/src/assets/images/favicon.png" />

    <!-- Preload LCP chart image so it starts downloading before the JS renders it (keep in sync with ChartSection) -->
    <link rel="preload" as="image" fetchpriority="high"
      imagesrcset="/src/assets/images/chart-640.webp 640w, /src/assets/images/chart-1024.webp 1024w, /src/assets/images/chart-1692.webp 1692w"
      imagesizes="(min-width: 1024px) 958px, calc(100vw - 32px)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
